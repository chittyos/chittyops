# ChittyConnect Configuration for chittyops
service:
  name: chittyops
  display_name: Chittyops
  type: operations
  tier: 3
  organization: CHITTYOS
  chitty_id: ${CHITTYOPS_SERVICE_ID}
  domains:
    production: ops.chitty.cc

onboarding:
  endpoint: https://get.chitty.cc/api/onboard
  provisions: [chitty_id, service_token, certificate, trust_chain]

auth:
  provider: chittyauth
  endpoint: https://auth.chitty.cc
  service_token:
    source: chittyconnect
    key: CHITTYOPS_SERVICE_TOKEN

secrets:
  provider: chittyconnect
  # Cold source of truth: ChittySecrets (secrets.chitty.cc), fronting Cloudflare
  # Secrets Store. Runtime delivery is Cloudflare Secrets; KV only for short-lived
  # cache or rotation state. 1Password is retired as of 2026-08-21 — never declare
  # `vault: 1password` or an `op://` path here; `op` has zero accounts and any such
  # reference is unresolvable.
  cold_source: chittysecrets
  runtime_delivery: cloudflare-secrets

github:
  repository: CHITTYOS/chittyops

monitoring:
  health:
    endpoint: /health
    interval: 60s
