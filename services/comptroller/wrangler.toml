name = "comptroller"
main = "worker.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
account_id = "0bc21e3a5a9de1a4cc843be9c3e98121"  # ChittyCorp LLC

# Comptroller is Tier-Infrastructure: must always run.
# L1 only at cold-start for 24h. L2/L3 require BASELINE_LEARNING=false in policy_flags.

routes = [
  { pattern = "comptroller.chitty.cc", custom_domain = true }
]

# NO CRONS — the schedule has moved to chittyagent-comptroller.
#
# CHITTYOS/chittyentity chittyagents/comptroller is the cutover target (operator decision,
# 2026-09-18). Its wrangler.jsonc states the invariant: "Sequenced so there is NEVER two active
# cron-writers." That invariant was violated — the agent's production env was deployed with its
# crons on 2026-09-17 20:04 while this worker still had its own, inverting the documented order.
# Verified against the live API, both scripts had all four schedules registered:
#
#   GET /accounts/.../workers/scripts/{name}/schedules
#     comptroller             -> */5, 0 7 * * *, 0 7 * * 1, 0 9 1 * *
#     chittyagent-comptroller -> */5, 0 7 * * *, 0 7 * * 1, 0 9 1 * *
#
# Two cron-writers against the same Hyperdrive configs meant duplicate ingest, duplicate anomaly
# detection and duplicate hard-cap evaluation. ON CONFLICT DO NOTHING dedupes the ledger rows;
# nothing dedupes the alerting. It was inert only because the AI gateways have had no traffic
# since 2026-08-18 (cost_ledger took 0 rows in the preceding 30h) — it would have fired the
# moment traffic resumed.
#
# Removing these four leaves the agent as the sole scheduled writer, which is the documented
# direction. This worker keeps serving comptroller.chitty.cc over HTTP; the custom domain moves
# at full cutover, since a domain binds to one worker at a time.
#
# Was: "*/5 * * * *", "0 7 * * *", "0 7 * * 1", "0 9 1 * *"
#
# Refs #121.

[vars]
REGISTRY_URL = "https://registry.chitty.cc"
HEARTBEAT_URL = "https://discovery.chitty.cc/heartbeat/comptroller"
NOTION_BUSINESS_REPORT_PAGE_ID = "REPLACE_AT_DEPLOY"
NOTION_LEGALINK_REPORT_PAGE_ID = "REPLACE_AT_DEPLOY"
CF_ACCOUNT_ID = "0bc21e3a5a9de1a4cc843be9c3e98121"

# READ path: comptroller_reader (read-only) on restless-grass-40598426 / ChittyOS-Core, direct host
[[hyperdrive]]
binding = "NEON_COMPTROLLER"
id = "90b3bda653a64a96ae79580991623d31"

# WRITE path (Phase-A ingest): SEPARATE Hyperdrive binding over the comptroller_writer role
# (append-only INSERT on chittyops.cost_ledger + chittyops.anomalies) on the SAME Neon project
# (restless-grass-40598426 / ChittyOS-Core). porsager `postgres` needs a TCP socket, which on
# Workers only comes from Hyperdrive's connectionString. getWriteDb() fails closed if absent.
# origin: ep-green-water-ael1lksw.c-2.us-east-2.aws.neon.tech / db neondb / role comptroller_writer
[[hyperdrive]]
binding = "NEON_COMPTROLLER_WRITER"
id = "4427ea043c524bb1a22a5b4e0953d297"

[[kv_namespaces]]
binding = "KV_STATE"
id = "03cd968da5eb41d6bc13c9ee48d22254"

# Workers-AI (T0) — narrative generation for GET /api/v1/insights ONLY. SQL/JS owns every
# number; the model emits prose only. Runs in-account (no external billing key).
[ai]
binding = "AI"

[observability]
enabled = true

[[tail_consumers]]
service = "chittytrack"
