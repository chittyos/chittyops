name: Ralph loop contract
on:
  pull_request:
    paths:
      - 'ralph-loop/**'
      - 'test/ralph-loop.test.js'
      - '.github/workflows/ralph-loop-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/ralph-loop.test.js
