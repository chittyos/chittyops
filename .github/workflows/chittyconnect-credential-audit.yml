name: ChittyConnect credential audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  credential-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify broker configuration and reject legacy secret dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s .chittyconnect.yml
          if grep -R -n -E '(^|[^[:alnum:]_])(OP_SERVICE_ACCOUNT_TOKEN|ONEPASSWORD_SERVICE_ACCOUNT_TOKEN)([^[:alnum:]_]|$)' .github/workflows/ralph-loop-contract.yml ralph-loop/ 2>/dev/null; then
            echo "Ralph loop must not depend on retired 1Password credential paths"
            exit 1
          fi
          echo "Static credential contract passed; live ChittyConnect broker verification is a separate release gate."
